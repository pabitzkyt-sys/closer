<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#080b18"><title>VOID RUNNER</title><style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#080b18;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}body{display:grid;place-items:center}.wrap{position:relative;width:100%;height:100%;max-width:560px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#171c46,#080b18 55%,#050711)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;z-index:3;pointer-events:none}.pill{background:#0b1028dd;border:1px solid #7df9ff44;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}.power{width:100%;text-align:center;display:none}.power.on{display:block}.center{position:absolute;inset:0;display:grid;place-items:center;z-index:5;padding:24px;background:#05071199;backdrop-filter:blur(4px)}.card{width:min(100%,390px);text-align:center;padding:28px 22px;border-radius:26px;background:#101631f2;border:1px solid #82f7ff55;box-shadow:0 20px 70px #0009}h1{margin:0;font-size:54px;line-height:.9;letter-spacing:-.06em;background:linear-gradient(135deg,#fff,#77f7ff 45%,#c980ff);-webkit-background-clip:text;color:transparent}p{color:#bdc7e9;line-height:1.45}button{border:0;border-radius:17px;padding:15px 20px;width:100%;font-size:17px;font-weight:900;background:linear-gradient(135deg,#77f7ff,#be89ff);color:#09101b;margin-top:9px}.hidden{display:none}.toast{position:absolute;top:27%;left:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:1000;z-index:4;pointer-events:none;white-space:nowrap}.controls{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#8291c2;font-size:11px;z-index:2;pointer-events:none}</style></head><body><div class="wrap"><canvas id="game"></canvas><div class="hud"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">KILLS <span id="kills">0</span></div><div class="pill">COINS 🪙 <span id="coins">0</span></div><div class="pill">LEVEL <span id="level">1</span></div><div class="pill">BEST <span id="bestHud">0</span></div><div class="pill power" id="powerHud"><span id="powerName"></span> <span id="powerTime"></span>s</div></div><div class="toast" id="toast"></div><div class="controls">DRAG TO STEER • AUTO-FIRE</div><div class="center" id="start"><div class="card"><h1>VOID<br>RUNNER</h1><p>Blast enemies, collect coins, grab weapon bonuses, survive waves, and beat bosses. Speed increases only after each boss.</p><button id="go">LAUNCH</button></div></div><div class="center hidden" id="over"><div class="card"><h1>BOOM.</h1><p>Score <b id="finalScore">0</b> • Level <b id="finalLevel">1</b> • Coins <b id="finalCoins">0</b></p><button id="revive">REVIVE</button><button id="again">RUN IT BACK</button></div></div></div><script>
const c=document.querySelector('#game'),ctx=c.getContext('2d'),$=s=>document.querySelector(s);let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio||1,2);W=Math.min(innerWidth,560);H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
let running=false,last=0,t=0,score=0,kills=0,coins=0,level=1,best=+(localStorage.voidRunnerBest||0),player,enemies=[],shots=[],drops=[],particles=[],boss=null,enemyTimer=0,coinTimer=1.2,powerTimer=7,waveTimer=8,shotTimer=0,power=null,powerLeft=0,shield=false,mult=1,multLeft=0,slowLeft=0,bossProgress=0;
const BOSS_TARGET=2500,colors=['#ff315c','#ff7043','#d843ff','#ff3d71','#ff9f43'],shapes=['spike','diamond','hex','ring'],powerInfo={spread:['SPREAD','#ffe47a'],twin:['TWIN','#8cffb7'],rapid:['RAPID','#ff8cff'],pierce:['PIERCE','#7ab8ff'],shield:['SHIELD','#72a7ff'],slow:['SLOW','#b58cff'],mult:['2X SCORE','#ffe47a'],bomb:['BOMB','#ffffff']};
function ui(){$('#score').textContent=Math.floor(score);$('#kills').textContent=kills;$('#coins').textContent=coins;$('#level').textContent=level;$('#bestHud').textContent=best;if(power){$('#powerHud').classList.add('on');$('#powerName').textContent=powerInfo[power][0];$('#powerTime').textContent=powerLeft.toFixed(1)}else $('#powerHud').classList.remove('on')}
function say(s,col='#77f7ff'){$('#toast').textContent=s;$('#toast').style.color=col;$('#toast').animate([{opacity:0,transform:'translate(-50%,-50%) scale(.8)'},{opacity:1},{opacity:0,transform:'translate(-50%,-65%)'}],{duration:650})}
function burst(x,y,col,n=16){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=40+Math.random()*160;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.5,col})}}
function addScore(n){score+=n;if(!boss)bossProgress+=n}
function reset(){t=score=kills=coins=bossProgress=0;level=1;player={x:W/2,y:H*.8,r:14,target:W/2};enemies=[];shots=[];drops=[];particles=[];boss=null;enemyTimer=0;coinTimer=1.1;powerTimer=6;waveTimer=8;shotTimer=0;power=null;powerLeft=0;shield=false;mult=1;multLeft=0;slowLeft=0;ui()}
function launch(){reset();$('#start').classList.add('hidden');$('#over').classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}$('#go').onclick=launch;$('#again').onclick=launch;
function aim(e){if(!running)return;let r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;player.target=Math.max(18,Math.min(W-18,p.clientX-r.left))}addEventListener('pointermove',aim,{passive:true});addEventListener('pointerdown',aim,{passive:true});addEventListener('touchmove',aim,{passive:true});
function addEnemy(x=null,y=-28){let r=11+Math.random()*15,beh='normal',q=Math.random();if(q<.18)beh='hunter';else if(q<.35)beh='zig';else if(level>=3&&q<.48)beh='armor';let px=x??r+Math.random()*(W-2*r);enemies.push({x:px,y,r,vy:(130+Math.random()*55)*(1+(level-1)*.16),a:Math.random()*6,beh,baseX:px,tt:0,hp:beh==='armor'?3:1,color:colors[Math.floor(Math.random()*colors.length)],shape:shapes[Math.floor(Math.random()*shapes.length)],near:false})}
function addDrop(kind){drops.push({kind,x:28+Math.random()*(W-56),y:-24,r:12,vy:105,a:0,type:kind==='power'?Object.keys(powerInfo)[Math.floor(Math.random()*Object.keys(powerInfo).length)]:null})}
function fire(){if(power==='spread'){for(const vx of[-150,0,150])shots.push({x:player.x,y:player.y-20,vx,vy:-620,r:4,col:'#ffe47a',pierce:false})}else if(power==='twin'){shots.push({x:player.x-8,y:player.y-20,vx:0,vy:-650,r:4,col:'#8cffb7'});shots.push({x:player.x+8,y:player.y-20,vx:0,vy:-650,r:4,col:'#8cffb7'})}else shots.push({x:player.x,y:player.y-20,vx:0,vy:-650,r:4,col:power==='pierce'?'#7ab8ff':'#77f7ff',pierce:power==='pierce'})}
function activate(type){if(type==='shield'){shield=true;say('SHIELD READY','#72a7ff');return}if(type==='slow'){slowLeft=10;say('SLOW TIME','#b58cff');return}if(type==='mult'){mult=2;multLeft=10;say('2X SCORE','#ffe47a');return}if(type==='bomb'){for(const e of enemies)burst(e.x,e.y,'#fff',8);addScore(enemies.length*20);enemies=[];say('VOID BOMB','#fff');return}power=type;powerLeft=10;say(powerInfo[type][0],powerInfo[type][1])}
function spawnBoss(){enemies=[];boss={x:W/2,y:100,r:48,hp:35+level*12,max:35+level*12,dir:1,shot:1};bossProgress=BOSS_TARGET;say('BOSS '+level,'#ff6b82')}
function die(){if(shield){shield=false;enemies=enemies.filter(e=>Math.hypot(e.x-player.x,e.y-player.y)>70);say('SHIELD SAVED YOU','#72a7ff');return}running=false;let f=Math.floor(score);if(f>best){best=f;localStorage.voidRunnerBest=best}$('#finalScore').textContent=f;$('#finalLevel').textContent=level;$('#finalCoins').textContent=coins;let cost=10*level;$('#revive').textContent=`REVIVE • ${cost} 🪙`;$('#revive').disabled=coins<cost;$('#revive').style.opacity=coins<cost?'.45':'1';setTimeout(()=>$('#over').classList.remove('hidden'),180)}
$('#revive').onclick=()=>{let cost=10*level;if(coins<cost)return;coins-=cost;$('#over').classList.add('hidden');enemies=[];shots=[];player.x=player.target=W/2;shield=true;running=true;last=performance.now();ui();say('REVIVED','#ffe47a');requestAnimationFrame(loop)};
function update(dt){t+=dt;let passive=dt*3*mult;score+=passive;if(!boss)bossProgress+=passive;player.x+=(player.target-player.x)*Math.min(1,dt*11);if(powerLeft>0){powerLeft-=dt;if(powerLeft<=0)power=null}if(multLeft>0){multLeft-=dt;if(multLeft<=0)mult=1}if(slowLeft>0)slowLeft-=dt;let slow=slowLeft>0?.55:1;enemyTimer-=dt;coinTimer-=dt;powerTimer-=dt;waveTimer-=dt;shotTimer-=dt;if(!boss&&enemyTimer<=0){addEnemy();enemyTimer=.72+Math.random()*.45}if(!boss&&waveTimer<=0){for(let i=0;i<5+Math.min(level,4);i++)addEnemy(W*(i+1)/(6+Math.min(level,4)),-25-i*30);waveTimer=9+Math.random()*4;say('WAVE','#ff8a6b')}if(coinTimer<=0){addDrop('coin');coinTimer=1.8+Math.random()*1.6}if(powerTimer<=0){addDrop('power');powerTimer=8+Math.random()*5}if(shotTimer<=0){fire();shotTimer=power==='rapid'?.075:.18}
for(let i=enemies.length-1;i>=0;i--){let e=enemies[i];e.tt+=dt;e.y+=e.vy*dt*slow;if(e.beh==='zig')e.x=Math.max(e.r,Math.min(W-e.r,e.baseX+Math.sin(e.tt*4)*55));if(e.beh==='hunter')e.x+=Math.sign(player.x-e.x)*(70+level*10)*dt;if(e.y>H+40){enemies.splice(i,1);score=Math.max(0,score-35);if(!boss)bossProgress=Math.max(0,bossProgress-35);continue}if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r){die();return}if(!e.near&&e.y>player.y-5&&e.y<player.y+20){let d=Math.abs(e.x-player.x);if(d>e.r+player.r&&d<e.r+player.r+18){e.near=true;addScore(25*mult);say('NEAR MISS +25','#8cffb7')}}}
for(let i=drops.length-1;i>=0;i--){let d=drops[i];d.y+=d.vy*dt;d.a+=dt*4;if(d.y>H+35){drops.splice(i,1);continue}if(Math.hypot(d.x-player.x,d.y-player.y)<d.r+player.r){drops.splice(i,1);if(d.kind==='coin'){coins+=1;say('+1 COIN','#ffd95a')}else activate(d.type)}}
for(let i=shots.length-1;i>=0;i--){let s=shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.y<-25){shots.splice(i,1);continue}if(boss&&Math.hypot(s.x-boss.x,s.y-boss.y)<s.r+boss.r){boss.hp--;if(!s.pierce)shots.splice(i,1);if(boss.hp<=0){score+=750*level;burst(boss.x,boss.y,'#fff',70);boss=null;level++;bossProgress=0;enemies=[];say('LEVEL '+level+' • SPEED UP!','#77f7ff');ui();break}continue}for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];if(Math.hypot(s.x-e.x,s.y-e.y)<s.r+e.r){e.hp--;if(!s.pierce)shots.splice(i,1);if(e.hp<=0){enemies.splice(j,1);kills++;addScore(40*mult);burst(e.x,e.y,s.col,16)}break}}}
if(!boss&&bossProgress>=BOSS_TARGET)spawnBoss();if(boss){boss.x+=boss.dir*(85+level*7)*dt;if(boss.x<boss.r||boss.x>W-boss.r)boss.dir*=-1;boss.shot-=dt;if(boss.shot<=0){for(let k=-2;k<=2;k++)addEnemy(boss.x+k*24,boss.y+35);boss.shot=Math.max(.75,1.45-level*.06)}if(Math.hypot(boss.x-player.x,boss.y-player.y)<boss.r+player.r){die();return}}
for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.l-=dt;if(p.l<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.97;p.vy*=.97}ui()}
function drawEnemy(e){ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.a);ctx.shadowBlur=18;ctx.shadowColor=e.color;ctx.fillStyle=e.color;ctx.strokeStyle='#ffffff88';ctx.lineWidth=1.5;ctx.beginPath();if(e.shape==='diamond'){ctx.moveTo(0,-e.r);ctx.lineTo(e.r,0);ctx.lineTo(0,e.r);ctx.lineTo(-e.r,0)}else if(e.shape==='ring'){ctx.arc(0,0,e.r,0,6.28)}else{let n=e.shape==='hex'?6:10;for(let j=0;j<n;j++){let a=j*6.28/n,rr=e.shape==='spike'?(j%2?e.r*.55:e.r):e.r;j?ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr):ctx.moveTo(Math.cos(a)*rr,Math.sin(a)*rr)}}ctx.closePath();if(e.shape==='ring'){ctx.lineWidth=5;ctx.strokeStyle=e.color;ctx.stroke()}else{ctx.fill();ctx.stroke()}ctx.restore()}
function draw(){ctx.fillStyle='#080b18';ctx.fillRect(0,0,W,H);for(let i=0;i<65;i++){ctx.globalAlpha=.25+(i%5)*.1;ctx.fillStyle='#dbe4ff';ctx.fillRect((i*137)%W,(i*83+t*45*(1+i%3))%H,1+(i%3),1+(i%3))}ctx.globalAlpha=1;for(const e of enemies)drawEnemy(e);for(const d of drops){ctx.save();ctx.translate(d.x,d.y);ctx.shadowBlur=18;ctx.shadowColor=d.kind==='coin'?'#ffd95a':powerInfo[d.type][1];if(d.kind==='coin'){ctx.fillStyle='#f6b92b';ctx.strokeStyle='#fff1a6';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,d.r,0,6.28);ctx.fill();ctx.stroke();ctx.fillStyle='#7a4b00';ctx.font='900 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1)}else{ctx.strokeStyle=powerInfo[d.type][1];ctx.lineWidth=3;ctx.beginPath();for(let j=0;j<6;j++){let a=-1.57+j*1.047;j?ctx.lineTo(Math.cos(a)*d.r,Math.sin(a)*d.r):ctx.moveTo(Math.cos(a)*d.r,Math.sin(a)*d.r)}ctx.closePath();ctx.stroke()}ctx.restore()}for(const s of shots){ctx.save();ctx.shadowBlur=12;ctx.shadowColor=s.col;ctx.fillStyle=s.col;ctx.fillRect(s.x-2,s.y-10,4,14);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.l/.5);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,3,3)}ctx.globalAlpha=1;if(boss){ctx.save();ctx.translate(boss.x,boss.y);ctx.shadowBlur=25;ctx.shadowColor='#ff315c';ctx.fillStyle='#32102a';ctx.strokeStyle='#ff6b82';ctx.lineWidth=4;ctx.beginPath();for(let i=0;i<12;i++){let a=i*6.28/12,r=i%2?boss.r*.72:boss.r;i?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();ctx.fillStyle='#30111b';ctx.fillRect(30,116,W-60,9);ctx.fillStyle='#ff5475';ctx.fillRect(30,116,(W-60)*boss.hp/boss.max,9)}ctx.save();ctx.translate(player.x,player.y);ctx.shadowBlur=24;ctx.shadowColor=shield?'#72a7ff':'#a878ff';ctx.fillStyle=shield?'#72a7ff':'#b58cff';ctx.beginPath();ctx.moveTo(0,-18);ctx.lineTo(14,13);ctx.lineTo(0,8);ctx.lineTo(-14,13);ctx.closePath();ctx.fill();ctx.fillStyle='#77f7ff';ctx.fillRect(-3,-17,6,7);ctx.restore()}
function loop(now){if(!running)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}reset();draw();
</script></body></html>
