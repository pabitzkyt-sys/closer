<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080b18">
<link rel="manifest" href="manifest.webmanifest">
<title>VOID RUNNER</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;background:#080b18;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}body{display:grid;place-items:center}.wrap{position:relative;width:100%;height:100%;max-width:560px;overflow:hidden;background:radial-gradient(circle at 50% 20%,#171c46 0,#0a0d20 45%,#050711 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.hud{position:absolute;top:max(14px,env(safe-area-inset-top));left:16px;right:16px;display:flex;justify-content:space-between;gap:12px;z-index:3;pointer-events:none}.pill{background:#0b1028cc;border:1px solid #7df9ff55;border-radius:999px;padding:8px 13px;font-weight:800;letter-spacing:.04em;box-shadow:0 0 20px #00e5ff22}.center{position:absolute;inset:0;display:grid;place-items:center;z-index:4;padding:26px;background:#05071188;backdrop-filter:blur(4px)}.card{width:min(100%,390px);text-align:center;padding:28px 24px;border-radius:28px;background:linear-gradient(180deg,#12183be8,#080c20f5);border:1px solid #82f7ff55;box-shadow:0 24px 80px #0008,0 0 42px #6b5cff22}h1{margin:0;font-size:clamp(38px,10vw,64px);line-height:.9;letter-spacing:-.06em;background:linear-gradient(135deg,#fff,#77f7ff 45%,#c980ff 85%);-webkit-background-clip:text;color:transparent;text-shadow:0 0 40px #71edff22}p{color:#b9c5ed;line-height:1.45;margin:16px 0 22px}.best{font-weight:800;color:#fff;margin-bottom:18px}button{appearance:none;border:0;border-radius:18px;padding:16px 22px;width:100%;font-size:18px;font-weight:900;letter-spacing:.05em;color:#09101b;background:linear-gradient(135deg,#77f7ff,#be89ff);box-shadow:0 10px 30px #65e9ff33;cursor:pointer}.tiny{font-size:12px;color:#7180ad;margin-top:14px}.hidden{display:none}.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}.toast{position:absolute;top:26%;left:50%;transform:translate(-50%,-50%) scale(.8);font-size:26px;font-weight:1000;letter-spacing:.04em;opacity:0;z-index:3;pointer-events:none;text-shadow:0 0 20px currentColor;white-space:nowrap}.controls{position:absolute;bottom:max(18px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#8291c2;font-size:12px;letter-spacing:.08em;z-index:2;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game"></canvas>
<div class="hud"><div class="pill">SCORE <span id="score">0</span></div><div class="pill">BEST <span id="bestHud">0</span></div></div>
<div class="toast" id="toast">NICE!</div><div class="flash" id="flash"></div>
<div class="controls">DRAG ANYWHERE TO STEER</div>
<div class="center" id="start">
 <div class="card"><h1>VOID<br>RUNNER</h1><p>Steer the little ship through the chaos. Dodge the red stuff. Grab glowing cores. It gets ridiculous fast.</p><div class="best">HIGH SCORE: <span id="best">0</span></div><button id="go">LAUNCH</button><div class="tiny">One thumb. No instructions. Good luck.</div></div>
</div>
<div class="center hidden" id="over">
 <div class="card"><h1>BOOM.</h1><p>You lasted <b><span id="seconds">0.0</span>s</b> and scored <b><span id="final">0</span></b>.</p><div class="best" id="record"></div><button id="again">RUN IT BACK</button><div class="tiny">Your high score stays on this phone.</div></div>
</div>
</div>
<script>
const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),bestHud=document.querySelector('#bestHud'),start=document.querySelector('#start'),over=document.querySelector('#over'),toast=document.querySelector('#toast'),flash=document.querySelector('#flash');
let W,H,dpr,player,things=[],particles=[],running=false,last=0,time=0,score=0,spawn=0,coreSpawn=0,shake=0,combo=0;
let best=+(localStorage.voidRunnerBest||0);bestEl.textContent=best;bestHud.textContent=best;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth>560?560:innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function reset(){player={x:W/2,y:H*.78,r:14,target:W/2};things=[];particles=[];time=0;score=0;spawn=0;coreSpawn=0;shake=0;combo=0;scoreEl.textContent=0}
function launch(){reset();start.classList.add('hidden');over.classList.add('hidden');running=true;last=performance.now();requestAnimationFrame(loop)}
document.querySelector('#go').onclick=launch;document.querySelector('#again').onclick=launch;
function aim(e){if(!running)return;let p=e.touches?e.touches[0]:e;let r=c.getBoundingClientRect();player.target=Math.max(20,Math.min(W-20,p.clientX-r.left))}addEventListener('pointermove',aim,{passive:true});addEventListener('pointerdown',aim,{passive:true});addEventListener('touchmove',aim,{passive:true});
function addEnemy(){let r=10+Math.random()*18;things.push({kind:'bad',x:r+Math.random()*(W-r*2),y:-30,r,vy:150+Math.random()*80+time*5,spin:Math.random()*6,a:Math.random()*6})}
function addCore(){things.push({kind:'core',x:25+Math.random()*(W-50),y:-25,r:10,vy:125+time*2,a:0})}
function burst(px,py,color,n=15){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*190;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.45,max:.8,color,size:2+Math.random()*4})}}
function say(t,color='#77f7ff'){toast.textContent=t;toast.style.color=color;toast.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.7)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.1)'},{opacity:0,transform:'translate(-50%,-65%) scale(1)'}],{duration:700})}
function die(){running=false;shake=15;burst(player.x,player.y,'#ff4b6e',45);flash.animate([{opacity:.7},{opacity:0}],{duration:320});draw();let final=Math.floor(score);if(final>best){best=final;localStorage.voidRunnerBest=best;bestHud.textContent=best;bestEl.textContent=best;document.querySelector('#record').textContent='NEW HIGH SCORE ✨'}else document.querySelector('#record').textContent='HIGH SCORE: '+best;document.querySelector('#final').textContent=final;document.querySelector('#seconds').textContent=time.toFixed(1);setTimeout(()=>over.classList.remove('hidden'),320);if(navigator.vibrate)navigator.vibrate([45,35,100])}
function update(dt){time+=dt;score+=dt*10*(1+combo*.08);scoreEl.textContent=Math.floor(score);player.x+=(player.target-player.x)*Math.min(1,dt*10);spawn-=dt;coreSpawn-=dt;if(spawn<=0){addEnemy();spawn=Math.max(.18,.72-time*.012)*(0.68+Math.random()*.65)}if(coreSpawn<=0){addCore();coreSpawn=1.3+Math.random()*1.8}
 for(let i=things.length-1;i>=0;i--){let o=things[i];o.y+=o.vy*dt;o.a+=dt*3;if(o.y>H+50){things.splice(i,1);continue}let dx=o.x-player.x,dy=o.y-player.y,rr=o.r+player.r;if(dx*dx+dy*dy<rr*rr){if(o.kind==='bad'){die();return}else{things.splice(i,1);combo=Math.min(combo+1,12);score+=100+combo*25;burst(o.x,o.y,'#77f7ff',20);say(combo>4?'COMBO ×'+combo:'+'+(100+combo*25));if(navigator.vibrate)navigator.vibrate(18)}}}
 for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.life-=dt;if(p.life<=0){particles.splice(i,1);continue}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98}
}
function starfield(){x.fillStyle='#080b18';x.fillRect(0,0,W,H);for(let i=0;i<70;i++){let sy=(i*83+time*55*(1+(i%4)) )%H,sx=(i*137)%W,sz=1+(i%3)*.5;x.globalAlpha=.25+(i%5)*.1;x.fillStyle='#c7d4ff';x.fillRect(sx,sy,sz,sz)}x.globalAlpha=1}
function draw(){x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}starfield();
 for(let o of things){if(o.kind==='bad'){x.save();x.translate(o.x,o.y);x.rotate(o.a);x.shadowBlur=18;x.shadowColor='#ff315c';x.fillStyle='#ff315c';x.beginPath();for(let j=0;j<8;j++){let a=j*Math.PI/4,rad=o.r*(j%2?0.72:1);let px=Math.cos(a)*rad,py=Math.sin(a)*rad;j?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill();x.restore()}else{x.save();x.translate(o.x,o.y);x.rotate(o.a);x.shadowBlur=24;x.shadowColor='#77f7ff';x.strokeStyle='#77f7ff';x.lineWidth=3;x.beginPath();x.arc(0,0,o.r,0,Math.PI*2);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(0,0,3.5,0,Math.PI*2);x.fill();x.restore()}}
 for(let p of particles){x.globalAlpha=Math.max(0,p.life/p.max);x.fillStyle=p.color;x.fillRect(p.x,p.y,p.size,p.size)}x.globalAlpha=1;
 if(player){x.save();x.translate(player.x,player.y);x.shadowBlur=26;x.shadowColor='#a878ff';x.fillStyle='#b58cff';x.beginPath();x.moveTo(0,-18);x.lineTo(14,13);x.lineTo(0,8);x.lineTo(-14,13);x.closePath();x.fill();x.fillStyle='#77f7ff';x.beginPath();x.moveTo(-5,10);x.lineTo(0,23+Math.random()*8);x.lineTo(5,10);x.fill();x.restore()}x.restore()}
function loop(now){if(!running)return;let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}
reset();draw();
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
</body></html>
